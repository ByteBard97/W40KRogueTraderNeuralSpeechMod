<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Lab</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--fg:#e6e8eb;--dim:#8b93a1;--acc:#e0a33a;--bad:#e5655a}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--panel:#fff;--line:#d8dce2;--fg:#1a1d22;--dim:#667085;--acc:#b9770e;--bad:#c0392b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 12px 0 0}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px}
@media (max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
select,button,input[type=text],textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
button{cursor:pointer}button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.dim{color:var(--dim);font-size:12px}
.knobs{display:block}
.grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;background:rgba(255,255,255,.02)}
.grp h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:600}
.grp .cells{display:flex;gap:2px}
.grp.bypassed{opacity:.4}
.grp h3{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stomp{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:2px;background:none;border:none;cursor:pointer}
.stomp .led{width:8px;height:8px;border-radius:50%;background:#3a2a1a;box-shadow:inset 0 0 2px #000}
.stomp.on .led{background:#ff5a3c;box-shadow:0 0 6px 2px rgba(255,90,60,.7)}
.stomp .pad{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a8a8a,#3c3c3c 70%);border:2px solid #1a1a1a;box-shadow:0 2px 0 #000}
.stomp:active .pad{transform:translateY(2px);box-shadow:none}
.fxgrid{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;gap:30px 38px;margin-top:12px;overflow-x:auto;padding:4px 4px 8px}
.slot{position:relative;display:flex;align-items:center}
.slot>.grp{width:100%;box-sizing:border-box}
.slot>.grp .cells{justify-content:space-around}
.arrow{position:absolute;color:var(--acc);font-size:22px;line-height:1}
.arrow.r{right:-31px;top:50%;transform:translateY(-50%)}
.arrow.l{left:-31px;top:50%;transform:translateY(-50%)}
.arrow.d{bottom:-30px;left:50%;transform:translateX(-50%)}
.net{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:.03em}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.flow .arr{color:var(--acc);font-size:20px}
.chip{border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--dim)}
.chip.op{border:none;font-size:18px;padding:0}
.chip.dry{border-style:solid}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;width:76px;user-select:none}
.knob label{font-size:10px;color:var(--dim);text-align:center;line-height:1.2;min-height:26px;display:flex;align-items:center}
.knob svg{width:52px;height:52px;cursor:ns-resize;touch-action:none}
.knob .trk{stroke:var(--line)}.knob .arc{stroke:var(--acc)}.knob .ptr{stroke:var(--fg)}
.knob input{width:58px;text-align:center;padding:3px 4px;font-variant-numeric:tabular-nums}
.knob.off svg{opacity:.55}
.scen{margin:6px 0 10px}.scen .dim{margin-top:4px}
.lines{max-height:60vh;overflow:auto}
.line{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.line:hover{background:var(--bg)}.line.on{background:var(--bg);outline:1px solid var(--acc)}
textarea{width:100%;height:320px;font:12px/1.4 ui-monospace,monospace;white-space:pre}
#err{color:var(--bad);white-space:pre-wrap;font-size:12px}
.toggle{display:inline-flex;gap:6px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>FX Lab</h1>
  <select id="speaker" title="Speaker"></select>
  <select id="dsp" title="Effect graph (.dsp)"></select>
  <button id="play" class="primary" disabled>Play loop</button>
  <label class="toggle"><input type="checkbox" id="bypass"> Raw (bypass effect)</label>
  <label class="toggle">Gap <input type="range" id="gap" min="0" max="2" step="0.1" value="0.6" style="width:90px"> <span id="gapv" class="dim">0.6s</span></label>
  <span id="status" class="dim"></span>
</header>
<main>
  <div class="card">
    <div class="dim" style="margin-bottom:6px">Lines (click to loop)</div>
    <div id="lines" class="lines"></div>
  </div>
  <div>
    <div class="card">
      <div class="row"><strong>Controls</strong><span id="dspname" class="dim"></span>
        <button id="reset">Reset to defaults</button>
        <span style="flex:1"></span>
        <input type="text" id="pname" placeholder="preset name" size="18">
        <select id="plist"><option value="">Load preset…</option></select>
        <button id="psave">Save preset</button></div>
      <div class="scen row"><select id="scen"><option value="">Starting point (by FX label)…</option></select></div>
      <div id="scendesc" class="dim"></div>
      <div id="controls" class="knobs" style="margin-top:10px"></div>
      <div id="err"></div>
    </div>
    <details class="card" style="margin-top:16px">
      <summary>Faust code (edit, then Apply)</summary>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="row"><button id="apply">Apply (recompile)</button><button id="savedsp">Save .dsp file</button>
        <span class="dim">Saving overwrites tools/fx_lab/faust/&lt;name&gt;.dsp</span></div>
    </details>
  </div>
</main>
<script type="module">
import { FaustDspGenerator } from '/faustwasm/index.js';

const $ = id => document.getElementById(id);
const ctx = new AudioContext({ latencyHint: 'interactive' });
const state = { node: null, src: null, buf: null, dspName: null, params: {}, descriptors: [], presets: {}, gen: 0 };
const dry = ctx.createGain(), wet = ctx.createGain();
dry.connect(ctx.destination); wet.connect(ctx.destination); dry.gain.value = 0;

const api = async (u, opt) => (await fetch(u, opt)).json();
const post = (u, b) => api(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
const setStatus = t => $('status').textContent = t;

/* ---------- audio ---------- */
async function loadClip(wav) {
  setStatus('loading…');
  const ab = await (await fetch('/wav/' + wav)).arrayBuffer();
  state.raw = await ctx.decodeAudioData(ab);
  rebuildBuffer(); setStatus('');
}
/* ---------- Voice Studio bridge: the studio sends a clip as bytes and is told when a preset is saved ---------- */
const STUDIO_ORIGINS = new Set(['http://127.0.0.1:8930', 'http://localhost:8930', 'http://127.0.0.1:8931', 'http://localhost:8931']);
let studioOrigin = null;
async function loadClipBytes(ab, name) {
  setStatus('loading ' + name + '…');
  state.raw = await ctx.decodeAudioData(ab);
  rebuildBuffer(); setStatus(name);
  $('play').disabled = false;
}
window.addEventListener('message', async e => {
  if (!STUDIO_ORIGINS.has(e.origin) || !e.data || e.data.type !== 'studio:load-clip') return;
  studioOrigin = e.origin;
  ctx.resume().catch(() => {});        // without a user gesture inside this frame the promise can stay pending: do not wait for it
  await loadClipBytes(e.data.bytes, e.data.name || 'clip from studio');
  startSource();
});
function tellStudio(msg) {
  if (window.parent === window) return;
  for (const o of studioOrigin ? [studioOrigin] : STUDIO_ORIGINS) window.parent.postMessage(msg, o);
}
window.studioBridge = { tellStudio };   // lets the studio's browser check exercise the reply path without saving a preset
function rebuildBuffer() {           // clip + silent gap, so echo tails and the loop point are audible
  if (!state.raw) return;
  const sr = state.raw.sampleRate, gap = Math.round(+$('gap').value * sr);
  const x = state.raw.getChannelData(0), b = ctx.createBuffer(1, x.length + gap, sr);
  b.getChannelData(0).set(x); state.buf = b;
  if (state.src) startSource();
}
function startSource() {
  stopSource();
  if (!state.buf) return;
  const s = ctx.createBufferSource(); s.buffer = state.buf; s.loop = true;
  s.connect(dry); if (state.node) s.connect(state.node);
  s.start(); state.src = s; $('play').textContent = 'Stop';
}
function stopSource() { if (state.src) { try { state.src.stop(); } catch {} state.src.disconnect(); state.src = null; } $('play').textContent = 'Play loop'; }
$('play').onclick = async () => { await ctx.resume(); state.src ? stopSource() : startSource(); };
$('gap').oninput = () => { $('gapv').textContent = (+$('gap').value).toFixed(1) + 's'; rebuildBuffer(); };
function applyBypass() { const raw = $('bypass').checked; dry.gain.value = raw ? 1 : 0; wet.gain.value = raw ? 0 : 1; }
$('bypass').onchange = applyBypass;

/* ---------- faust ---------- */
const labelOf = d => d.label;
async function compile(code) {
  const my = ++state.gen;
  $('err').textContent = '';
  const errs = [], oe = console.error; console.error = (...a) => { errs.push(a.join(' ')); oe(...a); };
  let node = null;
  try { node = await new FaustDspGenerator().createFaustNode(ctx, 'fx' + my, code); }
  catch (e) { errs.push(String(e)); }
  console.error = oe;
  if (!node) { $('err').textContent = 'Compile failed:\n' + (errs.join('\n') || 'unknown error (see console)'); return false; }
  if (state.node) { try { state.node.disconnect(); } catch {} if (state.src) try { state.src.disconnect(state.node); } catch {} }
  state.node = node; node.connect(wet);
  if (state.src) state.src.connect(node);
  state.descriptors = node.getDescriptors().filter(d => d.type !== 'button' || true);
  for (const d of state.descriptors) {
    const v = d.shortname in state.params ? state.params[d.shortname] : initOf(d);
    state.params[d.shortname] = v; node.setParamValue(d.address, v);
  }
  renderControls(); applyBypass();
  return true;
}
const initOf = d => d.type === 'checkbox' ? 1 : +d.init;     // Faust checkboxes have no init value: stomps default to on
const SKEW = d => /\b(Hz|ms)\b/.test(d.label) ? 2 : 1;      // frequency / time knobs: finer at the low end
const toT = (d, v) => Math.pow(Math.min(1, Math.max(0, (v - d.min) / (d.max - d.min))), 1 / SKEW(d));
const fromT = (d, t) => { let v = d.min + (d.max - d.min) * Math.pow(t, SKEW(d)); if (d.step) v = Math.round(v / d.step) * d.step; return Math.min(d.max, Math.max(d.min, v)); };
const decimals = d => { const st = String(d.step || 1); return st.includes('.') ? st.split('.')[1].length : 0; };
function renderControls() {
  const box = $('controls'); box.innerHTML = '';
  const order = d => { const k = d.meta && d.meta[0] ? parseInt(Object.keys(d.meta[0])[0], 10) : NaN; return isNaN(k) ? 1e3 : k; };
  const NS = 'http://www.w3.org/2000/svg', R = 20, C = 26, A0 = -135, A1 = 135;
  const pt = (deg, r) => [C + r * Math.sin(deg * Math.PI / 180), C - r * Math.cos(deg * Math.PI / 180)];
  const arc = (a0, a1) => { const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R); return `M${x0} ${y0} A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
  // Signal flow of chain.dsp: input -> hp -> lp -> de-ess -> EQ -> pitch -> harmonizer -> low shelf -> vocoder -> compressor -> drive -> resonator -> crush -> ring -> tremolo -> chorus -> wow/flutter -> phaser -> dropout -> echo -> static -> reverb -> blend with raw -> output -> limiter
  const GROUPS = [['Highpass', /^Highpass/], ['Lowpass', /^Lowpass/], ['De-esser', /^De_ess/], ['EQ', /^EQ_/], ['Pitch', /^Pitch/], ['Harmonizer', /^Harmonizer/], ['Low shelf', /^Low_shelf/], ['Vocoder', /^Vocoder/], ['Compressor', /^Compressor/], ['Drive', /^Drive/], ['Resonator', /^Resonator/], ['Bitcrush', /^Crush/],
    ['Ring mod', /^Ring/], ['Tremolo', /^Tremolo/], ['Chorus', /^Chorus/], ['Wow / flutter', /^(Wow|Flutter)/], ['Phaser', /^Phaser/], ['Dropout', /^Dropout/], ['Echo', /^Echo/], ['Static', /^Static/], ['Reverb', /^Reverb/], ['Mix / Output', /^(Mix|Output)/], ['Limiter', /^Limiter/]];
  const groups = new Map();
  const groupOf = d => { const g = GROUPS.find(([, re]) => re.test(d.shortname)); return g ? g[0] : 'Other'; };
  const cellsFor = name => {
    if (!groups.has(name)) {
      const g = document.createElement('div'); g.className = 'grp';
      g.innerHTML = `<h3>${name}</h3><div class="cells"></div>`; groups.set(name, g);
    }
    return groups.get(name).querySelector('.cells');
  };
  const stomps = [];
  for (const d of [...state.descriptors].sort((a, b) => order(a) - order(b))) {
    if (d.type === 'checkbox') {          // stomp switch: sits in its block's header
      const g = cellsFor(groupOf(d)).parentElement, sw = document.createElement('button'); sw.className = 'stomp'; sw.title = 'on / off';
      sw.innerHTML = '<i class="led"></i><b class="pad"></b>';
      const draw = () => { const on = +state.params[d.shortname] > 0.5; sw.classList.toggle('on', on); g.classList.toggle('bypassed', !on); };
      sw.onclick = () => { const v = +state.params[d.shortname] > 0.5 ? 0 : 1; state.params[d.shortname] = v; state.node.setParamValue(d.address, v); draw(); };
      g.querySelector('h3').append(sw); sw.redraw = draw; stomps.push(sw); continue;
    }
    if (!('min' in d)) continue;
    const cell = document.createElement('div'); cell.className = 'knob';
    const lab = document.createElement('label'); lab.textContent = d.label; lab.title = d.shortname;
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 52 52');
    svg.innerHTML = `<path class="trk" d="${arc(A0, A1)}" fill="none" stroke-width="4" stroke-linecap="round"/><path class="arc" fill="none" stroke-width="4" stroke-linecap="round"/><line class="ptr" stroke-width="2.5" stroke-linecap="round"/>`;
    const num = document.createElement('input'); num.type = 'number'; num.min = d.min; num.max = d.max; num.step = d.step || 'any';
    const draw = () => {
      const v = state.params[d.shortname], t = toT(d, v), ang = A0 + t * (A1 - A0);
      const [px, py] = pt(ang, R - 3), [qx, qy] = pt(ang, 6);
      const ln = svg.querySelector('.ptr'); ln.setAttribute('x1', qx); ln.setAttribute('y1', qy); ln.setAttribute('x2', px); ln.setAttribute('y2', py);
      svg.querySelector('.arc').setAttribute('d', t > 0.002 ? arc(A0, ang) : '');
      num.value = (+v).toFixed(decimals(d));
      cell.classList.toggle('off', +v === initOf(d));
    };
    const set = v => { v = Math.min(d.max, Math.max(d.min, v)); state.params[d.shortname] = v; state.node.setParamValue(d.address, v); draw(); };
    num.onchange = () => { const v = parseFloat(num.value); if (!isNaN(v)) set(v); else draw(); };
    let drag = null;
    svg.onpointerdown = e => { svg.setPointerCapture(e.pointerId); drag = { y: e.clientY, t: toT(d, state.params[d.shortname]) }; };
    svg.onpointermove = e => { if (!drag) return; const k = e.shiftKey ? 600 : 150; set(fromT(d, Math.min(1, Math.max(0, drag.t + (drag.y - e.clientY) / k)))); };
    svg.onpointerup = svg.onpointercancel = () => { drag = null; };
    svg.onwheel = e => { e.preventDefault(); set(fromT(d, Math.min(1, Math.max(0, toT(d, state.params[d.shortname]) - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.02))))); };
    svg.ondblclick = () => set(initOf(d));
    cell.redraw = draw; cell.append(lab, svg, num); cellsFor(groupOf(d)).append(cell);
  }
  // 2D snake layout: rows alternate left-to-right and right-to-left (4 rows of up to 5). Each item: [name, row, col, arrow direction out of it].
  const SLOTS = [['Input', 1, 1, 'r'], ['Highpass', 1, 2, 'r'], ['Lowpass', 1, 3, 'r'], ['De-esser', 1, 4, 'r'], ['EQ', 1, 5, 'd'],
    ['Pitch', 2, 5, 'l'], ['Harmonizer', 2, 4, 'l'], ['Low shelf', 2, 3, 'l'], ['Vocoder', 2, 2, 'l'], ['Compressor', 2, 1, 'd'],
    ['Drive', 3, 1, 'r'], ['Resonator', 3, 2, 'r'], ['Bitcrush', 3, 3, 'r'], ['Ring mod', 3, 4, 'r'], ['Tremolo', 3, 5, 'd'],
    ['Chorus', 4, 5, 'l'], ['Wow / flutter', 4, 4, 'l'], ['Phaser', 4, 3, 'l'], ['Dropout', 4, 2, 'l'], ['Echo', 4, 1, 'd'],
    ['Static', 5, 1, 'r'], ['Reverb', 5, 2, 'r'], ['Mix / Output', 5, 3, 'r'], ['Limiter', 5, 4, 'r'], ['Output', 5, 5, '']];
  const grid = document.createElement('div'); grid.className = 'fxgrid';
  const place = (el, row, col, dir) => {
    const c = document.createElement('div'); c.className = 'slot'; c.style.gridRow = row; c.style.gridColumn = col;
    c.append(el); if (dir) { const a = document.createElement('div'); a.className = 'arrow ' + dir; a.textContent = {r: '\u2192', l: '\u2190', d: '\u2193'}[dir]; c.append(a); }
    grid.append(c);
  };
  const chip = (t, c) => { const e = document.createElement('div'); e.className = 'chip ' + (c || ''); e.innerHTML = t; return e; };
  for (const [name, row, col, dir] of SLOTS) {
    if (name === 'Input') place(chip('Input<br><span class="net">\u25B8 net: raw</span>'), row, col, dir);
    else if (name === 'Output') place(chip('Output'), row, col, dir);
    else if (groups.has(name)) {
      if (name === 'Mix / Output') { const n = document.createElement('div'); n.className = 'net'; n.textContent = 'in: chain + net: raw'; groups.get(name).querySelector('h3').after(n); }
      place(groups.get(name), row, col, dir);
    }
  }
  if (groups.has('Other')) place(groups.get('Other'), 4, 1, '');
  box.append(grid);
  const note = document.createElement('div'); note.className = 'dim'; note.style.marginTop = '8px';
  note.textContent = 'Signal runs along the arrows. "net: raw" is the unprocessed input, fed straight to Mix (0 = all raw, 1 = all chain). Click the footswitch on a block to bypass it (dimmed, LED off); LED on = in the chain.';
  box.append(note);
  box.querySelectorAll('.knob').forEach(k => k.redraw());
  stomps.forEach(sw => sw.redraw());
}
const fmt = v => (Math.round(v * 1000) / 1000).toString();
$('reset').onclick = () => { for (const d of state.descriptors) state.params[d.shortname] = initOf(d); renderControls(); for (const d of state.descriptors) state.node.setParamValue(d.address, initOf(d)); };

/* ---------- dsp files & presets ---------- */
async function loadDsp(name) {
  state.dspName = name;
  const code = await (await fetch('/api/dsp/' + name)).text();
  $('code').value = code; $('dspname').textContent = name; state.params = {};
  await compile(code);
}
$('apply').onclick = () => compile($('code').value);
$('savedsp').onclick = async () => { await post('/api/dsp/' + state.dspName, { code: $('code').value }); setStatus('saved ' + state.dspName); };
$('dsp').onchange = () => loadDsp($('dsp').value);

async function loadScenarios() {
  const sc = (await api('/api/scenarios')).scenarios; state.scenarios = sc;
  const sel = $('scen');
  for (const x of sc) sel.append(new Option(x.name, x.name));
  sel.onchange = () => {
    const x = sc.find(v => v.name === sel.value); if (!x) { $('scendesc').textContent = ''; return; }
    $('scendesc').textContent = x.desc;
    for (const d of state.descriptors) state.params[d.shortname] = x.params[d.shortname] ?? initOf(d);
    renderControls(); for (const d of state.descriptors) state.node.setParamValue(d.address, state.params[d.shortname]);
  };
}
async function refreshPresets() {
  state.presets = await api('/api/presets');
  const sel = $('plist'); sel.innerHTML = '<option value="">Load preset…</option>';
  for (const n of Object.keys(state.presets).sort()) sel.append(new Option(`${n}  (${state.presets[n].dsp})`, n));
}
$('psave').onclick = async () => {
  const name = $('pname').value.trim(); if (!name) { setStatus('name the preset first'); return; }
  await post('/api/presets', { name, dsp: state.dspName, params: state.params }); await refreshPresets(); setStatus('saved preset ' + name); tellStudio({ type: 'studio:preset-saved', name });
};
$('plist').onchange = async () => {
  const p = state.presets[$('plist').value]; if (!p) return;
  $('pname').value = $('plist').value;
  if (p.dsp !== state.dspName) { $('dsp').value = p.dsp; await loadDsp(p.dsp); }
  for (const d of state.descriptors) if (d.shortname in p.params) state.params[d.shortname] = p.params[d.shortname];
  renderControls(); for (const d of state.descriptors) state.node.setParamValue(d.address, state.params[d.shortname]);
};

/* ---------- speakers & lines ---------- */
async function loadLines(speaker) {
  const lines = await api('/api/lines?speaker=' + encodeURIComponent(speaker));
  const box = $('lines'); box.innerHTML = '';
  lines.forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'line'; d.textContent = l.text.replace(/\{\/?n\}/g, '') || l.guid;
    d.onclick = async () => { box.querySelectorAll('.on').forEach(e => e.classList.remove('on')); d.classList.add('on'); await ctx.resume(); await loadClip(l.wav); startSource(); $('play').disabled = false; };
    box.append(d);
  });
}
(async () => {
  const sp = await api('/api/speakers');
  for (const s of sp) $('speaker').append(new Option(`${s.speaker} (${s.count})`, s.speaker));
  $('speaker').onchange = () => loadLines($('speaker').value);
  const dsps = await api('/api/dsps');
  for (const n of dsps) $('dsp').append(new Option(n, n));
  await refreshPresets(); await loadScenarios();
  await loadDsp(dsps.includes('chain.dsp') ? 'chain.dsp' : dsps[0]);
  $('dsp').value = state.dspName;
  const first = sp.find(s => s.speaker !== 'narrator') || sp[0];
  $('speaker').value = first.speaker; await loadLines(first.speaker);
})();
</script>
