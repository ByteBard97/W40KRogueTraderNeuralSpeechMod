<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Render audit</title>
<style>
:root{--bg:#14161a;--fg:#e4e6ea;--mut:#8b919c;--card:#1d2026;--line:#2d3139;--ok:#3fa66b;--bad:#d1495b;--warn:#d9a441;--acc:#5b9bd5}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--fg:#1c1f24;--mut:#666d78;--card:#fff;--line:#d8dce2}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:inherit}
button{cursor:pointer}button.on{border-color:var(--acc);background:var(--acc);color:#fff}
#stats{color:var(--mut);margin-left:auto}
main{padding:12px 16px;max-width:1100px;margin:auto}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.row.sel{outline:2px solid var(--acc)}.row.good{border-left-color:var(--ok)}.row.bad{border-left-color:var(--bad)}
.meta{color:var(--mut);font-size:12px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:4px}
.fl{color:var(--warn);font-weight:600}
.txt{font-size:15px;margin:2px 0 6px}.ctx{color:var(--mut);font-size:12px;margin-bottom:6px}
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.act .g.on{background:var(--ok);border-color:var(--ok)}.act .b.on{background:var(--bad);border-color:var(--bad)}
.tag.on{background:var(--warn);border-color:var(--warn);color:#000}
.note{flex:1;min-width:160px}
.pg{display:flex;gap:8px;justify-content:center;margin:12px}
small{color:var(--mut)}
</style></head><body>
<header>
<select id="speaker"></select><select id="ref"></select><select id="engine"></select><select id="flag"></select><select id="vstate"></select>
<select id="sort"><option value="sus">Suspicious first</option><option value="cpsd">Slowest first</option><option value="cpsa">Fastest first</option><option value="durd">Longest first</option><option value="dura">Shortest first</option><option value="rand">Random</option></select>
<input id="q" placeholder="search text" size="16">
<select id="fx" title="consonant-burst compressor applied to playback (x toggles)"><option value="off">compressor: off</option><option value="mild">compressor: mild</option><option value="strong">compressor: strong</option></select><span id="stats"></span>
</header>
<main><div id="list"></div><div class="pg"><button id="prev">Prev</button><span id="pn"></span><button id="next">Next</button></div>
<small>Keys: j/k move, space play/stop, g good, b bad, u clear, n next unjudged, x compressor on/off (keeps your place in the clip).</small></main>
<audio id="au"></audio>
<script>
const TAGS=['truncated','garbled','runaway','wrong voice','wrong emotion','robotic','artifact','mispronounced','too fast/slow','bad pause'];
let C=[],V={},F=[],page=0,sel=0;const PER=40;const $=id=>document.getElementById(id);
const au=$('au');let playing=null;
function opt(el,vals,all){el.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${v}</option>`).join('')}
async function init(){
 const r=await (await fetch('/api/clips')).json();C=r.clips;V=r.verdicts;
 const cnt=k=>[...new Set(C.map(c=>c[k]))].sort();
 opt($('speaker'),cnt('speaker'),'all speakers');opt($('ref'),cnt('ref').filter(Boolean),'all clone sources');$('ref').style.display=C.some(c=>c.ref)?'':'none';opt($('engine'),cnt('engine'),'all engines');
 opt($('flag'),['any flag','no flag',...[...new Set(C.flatMap(c=>c.flags))].sort()],'all flags');
 opt($('vstate'),['unjudged','good','bad'],'all verdicts');
 for(const id of['speaker','ref','engine','flag','vstate','sort'])$(id).onchange=()=>{page=0;sel=0;apply()};
 $('q').oninput=()=>{page=0;sel=0;apply()};
 $('prev').onclick=()=>{page=Math.max(0,page-1);sel=0;render()};$('next').onclick=()=>{page++;sel=0;render()};
 apply()}
function apply(){
 const rf=$('ref').value,s=$('speaker').value,e=$('engine').value,f=$('flag').value,v=$('vstate').value,q=$('q').value.toLowerCase();
 F=C.filter(c=>(!s||c.speaker===s)&&(!rf||c.ref===rf)&&(!e||c.engine===e)&&(!q||c.text.toLowerCase().includes(q))&&
  (!f||(f==='any flag'?c.flags.length:f==='no flag'?!c.flags.length:c.flags.includes(f)))&&
  (!v||(v==='unjudged'?!V[c.guid]:V[c.guid]&&V[c.guid].verdict===v)));
 const so=$('sort').value,k={cpsd:c=>c.cps,cpsa:c=>-c.cps,durd:c=>-c.dur,dura:c=>c.dur,sus:c=>-c.flags.length*1000+Math.abs(c.cps-15),rand:()=>Math.random()}[so];
 F.sort((a,b)=>k(a)-k(b));render()}
function refStats(){if(!C.some(c=>c.ref))return'';const m={};C.forEach(c=>{const v=V[c.guid];const r=m[c.ref]=m[c.ref]||{g:0,b:0,n:0};r.n++;if(v&&v.verdict==='good')r.g++;if(v&&v.verdict==='bad')r.b++});return ' | '+Object.entries(m).sort().map(([k,r])=>`${k}: ${r.g}g/${r.b}b/${r.n}`).join('  ')}
function stats(){const g=Object.values(V).filter(x=>x.verdict==='good').length,b=Object.values(V).filter(x=>x.verdict==='bad').length;
 $('stats').textContent=`${F.length} shown of ${C.length} | good ${g} bad ${b} unjudged ${C.length-g-b}`+refStats()}
function render(){
 stats();const items=F.slice(page*PER,page*PER+PER);$('pn').textContent=`page ${page+1}/${Math.max(1,Math.ceil(F.length/PER))}`;
 $('list').innerHTML='';items.forEach((c,i)=>{
  const v=V[c.guid]||{},d=document.createElement('div');d.className='row '+(v.verdict||'')+(i===sel?' sel':'');d.id='r'+i;
  d.innerHTML=`<div class="meta"><b>${c.speaker}</b><span>${c.engine}</span><span>${c.voice_source}</span>${c.ref?`<span><b>clone: ${c.ref}</b></span>`:''}<span>${c.dur}s</span><span>${c.cps} ch/s</span><span>${c.emotion||''}</span>${c.flags.length?`<span class="fl">${c.flags.join(' ')}</span>`:''}<span>${c.guid.slice(0,8)}</span></div>
  <div class="txt">${esc(c.text)}</div>${c.heard&&c.flags.some(f=>f.startsWith('asr_'))?`<div class="ctx" style="color:var(--warn)">heard (wer ${c.wer}): ${esc(c.heard)}</div>`:''}${c.context?`<div class="ctx">in: ${esc(c.context.slice(0,300))}</div>`:''}${c.instruct?`<div class="ctx">delivery: ${esc(c.instruct)}</div>`:''}
  <div class="act"><button class="p">Play</button>${c.ref_path?`<button class="pr" title="the reference clip this voice was cloned from">Play reference</button>`:''}${(c.real||[]).map((r,k)=>`<button class="rv" data-k="${k}" title="${esc(r.text)}">Real: ${esc(r.speaker)}${r.located?'':' (full line)'}</button>`).join('')}${c.old?`<button class="po" title="the earlier render of this line (before the fixes)">Play old</button>`:''}<button class="g ${v.verdict==='good'?'on':''}">Good</button><button class="b ${v.verdict==='bad'?'on':''}">Bad</button>
  ${TAGS.map(t=>`<button class="tag ${(v.tags||[]).includes(t)?'on':''}">${t}</button>`).join('')}
  <input class="note" placeholder="note" value="${esc(v.note||'')}"></div>`;
  d.onclick=()=>{sel=i;document.querySelectorAll('.row').forEach((r,j)=>r.classList.toggle('sel',j===i))};
  d.querySelector('.p').onclick=()=>play(c);d.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{const r=c.real[+b.dataset.k];playing='real:'+c.guid;au.src='/realvo/'+r.wav.split('/').pop();au.play()});const pr=d.querySelector('.pr');if(pr)pr.onclick=()=>{playing='ref:'+c.guid;au.src='/refwav?path='+encodeURIComponent(c.ref_path);au.play()};const po=d.querySelector('.po');if(po)po.onclick=()=>{playing='old:'+c.guid;au.src='/old/'+c.guid+'.wav';au.play()};
  d.querySelector('.g').onclick=()=>judge(c,'good',i);d.querySelector('.b').onclick=()=>judge(c,'bad',i);
  d.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{const cur=V[c.guid]||{verdict:'bad',tags:[],note:''};const t=cur.tags||[];
   const n=t.includes(b.textContent)?t.filter(x=>x!==b.textContent):[...t,b.textContent];save(c,{...cur,verdict:cur.verdict||'bad',tags:n});render()});
  d.querySelector('.note').onchange=ev=>{const cur=V[c.guid]||{verdict:'bad',tags:[]};save(c,{...cur,note:ev.target.value})};
  $('list').appendChild(d)})}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function url(g){const f=$('fx').value;return '/wav/'+g+'.wav'+(f==='off'?'':'?fx='+f)}
function play(c){if(playing===c.guid&&!au.paused){au.pause();return}playing=c.guid;au.src=url(c.guid);au.play()}
function switchFx(){try{localStorage.setItem('fx',$('fx').value)}catch(e){}
 if(playing){const t=au.currentTime,was=!au.paused;au.src=url(playing);au.onloadedmetadata=()=>{au.currentTime=t;if(was)au.play();au.onloadedmetadata=null}}}
$('fx').onchange=switchFx;try{const f=localStorage.getItem('fx');if(f)$('fx').value=f}catch(e){}
let lastFx='mild';
async function save(c,v){if(v===null)delete V[c.guid];else V[c.guid]=v;
 try{const r=await fetch('/api/verdict',{method:'POST',body:JSON.stringify({guid:c.guid,...(v||{verdict:null})})});if(!r.ok)throw new Error(r.status);err('')}catch(e){err('SAVE FAILED - verdict not stored: '+e.message)}stats()}
function err(m){let e=$('err');if(!e){e=document.createElement('div');e.id='err';e.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#d1495b;color:#fff;padding:8px 16px;z-index:9;display:none';document.body.appendChild(e)}e.textContent=m;e.style.display=m?'block':'none'}
function judge(c,verdict,i){const cur=V[c.guid]||{tags:[],note:''};save(c,{...cur,verdict});
 const row=$('r'+i);if(row)row.className='row sel '+verdict;row&&row.querySelector('.g').classList.toggle('on',verdict==='good');row&&row.querySelector('.b').classList.toggle('on',verdict==='bad')}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 const items=F.slice(page*PER,page*PER+PER),c=items[sel];
 const mv=n=>{sel=Math.max(0,Math.min(items.length-1,n));document.querySelectorAll('.row').forEach((r,j)=>r.classList.toggle('sel',j===sel));$('r'+sel)?.scrollIntoView({block:'center'})};
 if(e.key==='j')mv(sel+1);else if(e.key==='k')mv(sel-1);else if(e.key===' '){e.preventDefault();c&&play(c)}
 else if(e.key==='g'&&c){judge(c,'good',sel);mv(sel+1)}else if(e.key==='b'&&c){judge(c,'bad',sel)}
 else if(e.key==='u'&&c){save(c,null);render()}
 else if(e.key==='x'){const s=$('fx');if(s.value!=='off'){lastFx=s.value;s.value='off'}else s.value=lastFx;switchFx()}
 else if(e.key==='n'){const i=items.findIndex((x,j)=>j>sel&&!V[x.guid]);if(i>=0)mv(i)}});
init();
</script></body></html>
